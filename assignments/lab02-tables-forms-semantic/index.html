<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="DarkMustang007">
    <title>Society Page</title>
</head>
<body>

    <header>
        <h1>IT Society</h1>
        <nav>
            <a href="#t1">Schedule</a>
            <a href="#f1">Join</a>
            <a href="#a1">Story</a>
        </nav>
    </header>

    <main>
        <section id="t1">
            <h2>Timetable</h2>
            <table>
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Class</th>
                </tr>
                <tr>
                    <td>Mon</td>
                    <td>4pm</td>
                    <td>Web Dev</td>
                </tr>
                <tr>
                    <td>Wed</td>
                    <td>5pm</td>
                    <td>Gaming</td>
                </tr>
                <tr>
                    <td>Fri</td>
                    <td>3pm</td>
                    <td>Python</td>
                </tr>
            </table>
        </section>

        <section id="f1">
            <h2>Join Form</h2>
            <form>
                <label for="nm">Name:</label>
                <input type="text" id="nm" name="nm"><br>

                <label for="em">Email:</label>
                <input type="email" id="em" name="em"><br>

                <label for="pw">Pass:</label>
                <input type="password" id="pw" name="pw"><br>

                <label for="sm">Term:</label>
                <input type="number" id="sm" name="sm"><br>

                <input type="checkbox" id="ch" name="ch">
                <label for="ch">I agree to rules</label><br>

                <button type="submit">Join</button>
            </form>
        </section>

        <article id="a1">
            <h2>Hackathon News</h2>
            <p>Our team joined the local campus hackathon event last weekend.</p>
            <p>We built a project using clean scripts and won first place.</p>
            <img src="hack.jpg" alt="A group of three students working together on laptops at a wooden desk">
        </article>
    </main>

    <footer>
        <p>&copy; 2026 IT Society.</p>
    </footer>

</body>
</html>
