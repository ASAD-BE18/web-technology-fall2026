<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Tayyab" content="Dark mustang">
  <title>CS Society</title>
</head>
<body>

  <header>
    <h1>CS Society</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#timetable">Timetable</a>
      <a href="#join">Join</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <article>
        <h2>Hackathon Story</h2>
        <p>Students built projects in 24 hours at our annual event.</p>
        <img src="hackathon.jpg" alt="Students writing code on laptops">
      </article>
    </section>

    <section id="timetable">
      <h2>Timetable</h2>
      <table>
        <tr><th>Day</th><th>Time</th><th>Activity</th></tr>
        <tr><td>Mon</td><td>10 AM</td><td>Coding Workshop</td></tr>
        <tr><td>Wed</td><td>02 PM</td><td>Guest Lecture</td></tr>
        <tr><td>Fri</td><td>04 PM</td><td>Project Demo</td></tr>
      </table>
    </section>

    <section id="join">
      <h2>Join Us</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass"><br>

        <label for="sem">Semester:</label>
        <input type="number" id="sem" name="sem"><br>

        <input type="checkbox" id="rules" name="rules">
        <label for="rules">I agree to the society rules</label><br>

        <button type="submit">Join</button>
      </form>
    </section>
  </main>

  <footer>
    <p>CS Society 2026</p>
  </footer>

</body>
</html>
