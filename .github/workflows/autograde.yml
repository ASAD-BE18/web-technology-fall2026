name: Autograde

# One workflow for every assignment. When a Pull Request changes files inside
# assignments/<folder>/, this runs that folder's tests:
#   tests/test.js  -> node --test
#   tests/test.php -> php
#   tests/test.py  -> python
# If main has a package-lock.json or requirements.txt in that folder, the
# packages are installed first, from main's copy (never the PR's).
# Releasing a new assignment only means adding its folder to assignments/ —
# no per-week workflow file is needed.
on:
  pull_request:
    paths:
      - "assignments/**"

# Read-only token. Pull Requests from forks never receive repository secrets,
# so nothing in this workflow uses any.
permissions:
  contents: read

concurrency:
  group: autograde-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run assignment tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request's code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the tests for each changed assignment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The GitHub account that opened this PR. The author-tag test
          # compares it with the username written in the submission.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -u
          folders=$(git diff --name-only "$BASE_SHA" HEAD -- assignments/ | cut -d/ -f2 | sort -u)
          if [ -z "$folders" ]; then
            echo "No files inside assignments/<folder>/ were changed — nothing to test."
            exit 0
          fi

          # PHP ships with GitHub's Ubuntu runners; install it only if missing.
          command -v php >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli; }
          php --version | head -1

          status=0
          for f in $folders; do
            echo "::group::Assignment: $f"
            if ! printf '%s' "$f" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::'$f' is not a valid assignment folder name."
              status=1; echo "::endgroup::"; continue
            fi
            if ! git cat-file -e "$BASE_SHA:assignments/$f/tests" 2>/dev/null; then
              echo "::error::assignments/$f is not a released assignment (it has no tests on main)."
              status=1; echo "::endgroup::"; continue
            fi

            # Always grade with the official tests from main, even if the PR
            # changed them (the Submission guard check flags that separately).
            rm -rf "assignments/$f/tests"
            git checkout "$BASE_SHA" -- "assignments/$f/tests"

            # Same for the package lists: install exactly what main pins, so a
            # PR cannot add or swap a package. --ignore-scripts stops packages
            # running install hooks.
            for dep in package.json package-lock.json requirements.txt; do
              if git cat-file -e "$BASE_SHA:assignments/$f/$dep" 2>/dev/null; then
                git checkout "$BASE_SHA" -- "assignments/$f/$dep"
              fi
            done
            py=python
            if git cat-file -e "$BASE_SHA:assignments/$f/package-lock.json" 2>/dev/null; then
              if ! (cd "assignments/$f" && npm ci --ignore-scripts --no-audit --no-fund); then
                echo "::error::Installing the npm packages for $f failed."
                status=1; echo "::endgroup::"; continue
              fi
            fi
            if git cat-file -e "$BASE_SHA:assignments/$f/requirements.txt" 2>/dev/null; then
              venv="$RUNNER_TEMP/venv-$f"
              if ! { python -m venv "$venv" && "$venv/bin/pip" install -q -r "assignments/$f/requirements.txt"; }; then
                echo "::error::Installing the Python packages for $f failed."
                status=1; echo "::endgroup::"; continue
              fi
              py="$venv/bin/python"
            fi

            ran=0
            if [ -f "assignments/$f/tests/test.js" ]; then
              ran=1
              node --test "assignments/$f/tests/test.js" || status=1
            fi
            if [ -f "assignments/$f/tests/test.php" ]; then
              ran=1
              php "assignments/$f/tests/test.php" || status=1
            fi
            if [ -f "assignments/$f/tests/test.py" ]; then
              ran=1
              "$py" "assignments/$f/tests/test.py" || status=1
            fi
            [ "$ran" -eq 1 ] || { echo "::error::No tests/test.js, tests/test.php or tests/test.py in $f"; status=1; }
            echo "::endgroup::"
          done
          exit $status
