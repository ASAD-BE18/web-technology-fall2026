name: Week 2 — HTML Basics

# Runs automatically whenever a Pull Request changes anything inside this
# assignment's folder. Uses Node.js's built-in test runner — no extra
# packages to install, so this finishes in well under a minute.
on:
  pull_request:
    paths:
      - "assignments/week02-html-basics/**"

# Least privilege: read-only. The similarity check only lists/reads other
# PRs — it must never gain write access, since pull_request events (unlike
# pull_request_target) run with a token this repo doesn't fully trust yet
# for a fork's own code, and that's deliberate here.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request's code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the Week 2 HTML Basics tests
        run: node --test assignments/week02-html-basics/tests/test.js

      # The similarity checker's source lives in a private instructor-only
      # repo, not here — so students can't read its threshold/logic and
      # tune a copy to slip under it. This key can only read that one repo.
      - name: Check out the similarity checker (private, instructor-only)
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ASAD-BE18/web-technology-fall2026-instructor
          ssh-key: ${{ secrets.INSTRUCTOR_TOOLS_DEPLOY_KEY }}
          path: instructor-tools

      - name: Check submission similarity against other pull requests
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNMENT_PATH: assignments/week02-html-basics
        run: node instructor-tools/scripts/check-similarity.js
